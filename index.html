<!doctype html>

  <meta name="theme-color" content="#05080f">

  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* set the saved theme before first paint (avoids a flash) */
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="nav">

          <rect x="1" y="1" width="30" height="30" rx="8" stroke="currentColor" stroke-opacity=".35"/>
          <path d="M5 19c4-8 13-10 22-5-6 1-10 6-22 5z" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M4 25c2-2 3.5 2 6 0s3.5 2 6 0 3.5 2 6 0 3.5 2 6 0" stroke="var(--accent-2)" stroke-width="1.6" stroke-linecap="round"/>

      <nav class="nav-links" aria-label="Main">
        <a href="#/resume" data-s="resume">Resume</a>
        <a href="#/portfolio" data-s="portfolio">Portfolio</a>
        <a href="#/blog" data-s="blog">Blog</a>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light / dark theme"></button>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="container"><p id="foot"></p></div>

  <script src="config.js"></script>
  <script src="assets/js/markdown.js"></script>

  <script src="assets/js/app.js"></script>

</html>
